name: Milestone → Feature Plans

on:
  pull_request:
    types: [closed]
    branches: [milestone]
    paths: ["ai-sdlc-docs/milestones/milestone-*.md"]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-plans:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Validate input
        run: |
          MILESTONE_FILE=$(git diff --name-only HEAD~1 HEAD | grep "^ai-sdlc-docs/milestones/milestone-" | head -1)
          if [ -z "$MILESTONE_FILE" ]; then
            echo "::error::No milestone file found in merged changes."
            exit 1
          fi
          echo "MILESTONE_FILE=$MILESTONE_FILE" >> "$GITHUB_ENV"

      - name: Check circuit breaker
        run: |
          ACTIVE=$(python3 -c "import json; c=json.load(open('ai-sdlc-docs/context/AI_PIPELINE_CONFIG.json')); print(str(c['circuit_breaker_active']).lower())")
          if [ "$ACTIVE" = "true" ]; then
            echo "::error::Circuit breaker is active."
            exit 1
          fi

      - name: Install script dependencies
        run: uv sync --frozen
        working-directory: .claude/scripts

      - name: Check context freshness
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import sys

          p = Path("ai-sdlc-docs/context/CODEBASE_OVERVIEW.md")
          if not p.exists():
              print("::error::Missing ai-sdlc-docs/context/CODEBASE_OVERVIEW.md. Run post-merge housekeeping.")
              sys.exit(1)
          age = datetime.now(timezone.utc) - datetime.fromtimestamp(p.stat().st_mtime, tz=timezone.utc)
          if age > timedelta(days=14):
              print(f"::error::ai-sdlc-docs/context/CODEBASE_OVERVIEW.md is stale ({age.days} days old).")
              sys.exit(1)
          print(f"Context freshness OK ({age.days} days old).")
          PY

      - name: Generate feature plans
        run: |
          uv run --project .claude/scripts python .claude/scripts/milestone_to_plans.py \
            --milestone-file "$MILESTONE_FILE" \
            --repo "${{ github.repository }}" \
            --context-dir ai-sdlc-docs/context
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_BEDROCK_ENDPOINT_URL: ${{ secrets.AWS_BEDROCK_ENDPOINT_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '❌ `milestone-to-plans` workflow failed. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });

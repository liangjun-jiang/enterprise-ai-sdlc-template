name: Plan → Execution Plan

on:
  pull_request:
    types: [closed]
    branches: [plan]
    paths: ["ai-sdlc-docs/plans/PLAN-*.md"]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Validate input
        run: |
          PLAN_FILE=$(git diff --name-only HEAD~1 HEAD | grep "^ai-sdlc-docs/plans/PLAN-" | head -1)
          if [ -z "$PLAN_FILE" ]; then
            echo "::error::No PLAN-NNN-*.md found in merged changes under ai-sdlc-docs/plans/"
            exit 1
          fi
          echo "PLAN_FILE=$PLAN_FILE" >> "$GITHUB_ENV"
          FEATURE_SLUG=$(basename "$PLAN_FILE" .md | sed 's/^PLAN-[0-9]*-//')
          echo "FEATURE_SLUG=$FEATURE_SLUG" >> "$GITHUB_ENV"
          echo "OUTPUT_FILE=ai-sdlc-docs/execution-plans/$FEATURE_SLUG/EXECUTION_PLAN.md" >> "$GITHUB_ENV"

      - name: Check circuit breaker
        run: |
          ACTIVE=$(python3 -c "import json; c=json.load(open('ai-sdlc-docs/context/AI_PIPELINE_CONFIG.json')); print(str(c['circuit_breaker_active']).lower())")
          if [ "$ACTIVE" = "true" ]; then
            echo "::error::Circuit breaker is active. Set circuit_breaker_active=false to resume."
            exit 1
          fi

      - name: Install script dependencies
        run: uv sync --frozen
        working-directory: .claude/scripts

      - name: Check context freshness
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import sys

          p = Path("ai-sdlc-docs/context/CODEBASE_OVERVIEW.md")
          if not p.exists():
              print("::error::Missing ai-sdlc-docs/context/CODEBASE_OVERVIEW.md. Run post-merge housekeeping.")
              sys.exit(1)
          age = datetime.now(timezone.utc) - datetime.fromtimestamp(p.stat().st_mtime, tz=timezone.utc)
          if age > timedelta(days=14):
              print(f"::error::ai-sdlc-docs/context/CODEBASE_OVERVIEW.md is stale ({age.days} days old).")
              sys.exit(1)
          print(f"Context freshness OK ({age.days} days old).")
          PY

      - name: Generate execution plan
        run: |
          uv run --project .claude/scripts python .claude/scripts/generate_execution_plan.py \
            --plan-file "$PLAN_FILE" \
            --context-dir ai-sdlc-docs/context \
            --output-file "$OUTPUT_FILE"
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_BEDROCK_ENDPOINT_URL: ${{ secrets.AWS_BEDROCK_ENDPOINT_URL }}

      - name: Open PR to plan-execution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="execution-plan/${{ env.FEATURE_SLUG }}"
          git checkout -b "$BRANCH"
          git add "${{ env.OUTPUT_FILE }}"
          git commit -m "feat: execution plan for ${{ env.FEATURE_SLUG }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Execution Plan: ${{ env.FEATURE_SLUG }}" \
            --body "Auto-generated execution plan from \`${{ env.PLAN_FILE }}\`. Review and merge to create GitHub Issues." \
            --base plan-execution \
            --head "$BRANCH" \
            --label "ai-generated"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '❌ `plan-to-execution` workflow failed. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });

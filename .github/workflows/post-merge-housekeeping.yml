name: Post-Merge Housekeeping

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  housekeeping:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: jdx/mise-action@v2

      - name: Check circuit breaker
        run: |
          ACTIVE=$(python3 -c "import json; c=json.load(open('docs/context/AI_PIPELINE_CONFIG.json')); print(str(c['circuit_breaker_active']).lower())")
          if [ "$ACTIVE" = "true" ]; then
            echo "::error::Circuit breaker is active."
            exit 1
          fi

      - name: Install script dependencies
        run: uv sync --frozen
        working-directory: .claude/scripts

      - name: Refresh codebase overview
        run: |
          uv run --project .claude/scripts python .claude/scripts/build_code_context.py

      - name: Update context docs
        run: |
          uv run --project .claude/scripts python .claude/scripts/update_context_docs.py \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --context-dir docs/context
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_BEDROCK_ENDPOINT_URL: ${{ secrets.AWS_BEDROCK_ENDPOINT_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const matches = body.matchAll(/[Cc]loses\s+#(\d+)/g);
            for (const match of matches) {
              const issueNumber = parseInt(match[1]);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed',
                state_reason: 'completed'
              });
              console.log(`Closed issue #${issueNumber}`);
            }

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '⚠️ `post-merge-housekeeping` failed. Context docs may need manual update. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).'
            });

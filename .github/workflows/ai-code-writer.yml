name: AI Code Writer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  write-code:
    if: github.event.label.name == 'ready-for-ai-coding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: jdx/mise-action@v2

      - name: Validate issue has a body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            if (!body || body.trim().length < 20) {
              core.setFailed('Issue body is empty or too short. Cannot generate code without a task description.');
            }

      - name: Check circuit breaker
        run: |
          ACTIVE=$(python3 -c "import json; c=json.load(open('ai-sdlc-docs/context/AI_PIPELINE_CONFIG.json')); print(str(c['circuit_breaker_active']).lower())")
          if [ "$ACTIVE" = "true" ]; then
            echo "::error::Circuit breaker is active. Set circuit_breaker_active=false to resume."
            exit 1
          fi

      - name: Install script dependencies
        run: uv sync --frozen
        working-directory: .claude/scripts

      - name: Check context freshness
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import sys

          p = Path("ai-sdlc-docs/context/CODEBASE_OVERVIEW.md")
          if not p.exists():
              print("::error::Missing ai-sdlc-docs/context/CODEBASE_OVERVIEW.md. Run post-merge housekeeping.")
              sys.exit(1)
          age = datetime.now(timezone.utc) - datetime.fromtimestamp(p.stat().st_mtime, tz=timezone.utc)
          if age > timedelta(days=14):
              print(f"::error::ai-sdlc-docs/context/CODEBASE_OVERVIEW.md is stale ({age.days} days old).")
              sys.exit(1)
          print(f"Context freshness OK ({age.days} days old).")
          PY

      - name: Generate and commit code
        run: |
          uv run --project .claude/scripts python .claude/scripts/write_code.py \
            --issue-number "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --context-dir ai-sdlc-docs/context
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_BEDROCK_ENDPOINT_URL: ${{ secrets.AWS_BEDROCK_ENDPOINT_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '❌ `ai-code-writer` failed to generate code for this issue. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });

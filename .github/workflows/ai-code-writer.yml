name: AI Code Writer

on:
  issues:
    types: [labeled]

jobs:
  write-code:
    if: github.event.label.name == 'ready-for-ai-coding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: jdx/mise-action@v2

      - name: Validate issue has a body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            if (!body || body.trim().length < 20) {
              core.setFailed('Issue body is empty or too short. Cannot generate code without a task description.');
            }

      - name: Check circuit breaker
        run: |
          ACTIVE=$(python3 -c "import json; c=json.load(open('docs/context/AI_PIPELINE_CONFIG.json')); print(str(c['circuit_breaker_active']).lower())")
          if [ "$ACTIVE" = "true" ]; then
            echo "::error::Circuit breaker is active. Set circuit_breaker_active=false to resume."
            exit 1
          fi

      - name: Install script dependencies
        run: uv sync --frozen
        working-directory: .claude/scripts

      - name: Generate and commit code
        run: |
          uv run --project .claude/scripts python .claude/scripts/write_code.py \
            --issue-number "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --context-dir docs/context
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: '❌ `ai-code-writer` failed to generate code for this issue. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });

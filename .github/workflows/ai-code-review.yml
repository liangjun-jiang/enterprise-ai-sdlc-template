name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on ai-generated label (retry for timing race)
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const maxAttempts = 6;
            const delayMs = 5000;

            let hasLabel = false;
            for (let i = 1; i <= maxAttempts; i++) {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              const labels = (pr.labels || []).map(l => l.name);
              core.info(`Attempt ${i}/${maxAttempts} labels: ${labels.join(', ') || '(none)'}`);
              if (labels.includes('ai-generated')) {
                hasLabel = true;
                break;
              }
              if (i < maxAttempts) {
                await new Promise(resolve => setTimeout(resolve, delayMs));
              }
            }

            core.setOutput('should_review', hasLabel ? 'true' : 'false');
            if (!hasLabel) {
              core.info("Skipping: PR does not have 'ai-generated' label.");
            }

      - uses: actions/checkout@v4
        if: steps.gate.outputs.should_review == 'true'
        with:
          ref: dev

      - uses: jdx/mise-action@v2
        if: steps.gate.outputs.should_review == 'true'

      - name: Check circuit breaker
        if: steps.gate.outputs.should_review == 'true'
        run: |
          ACTIVE=$(python3 -c "import json; c=json.load(open('docs/context/AI_PIPELINE_CONFIG.json')); print(str(c['circuit_breaker_active']).lower())")
          if [ "$ACTIVE" = "true" ]; then
            echo "::error::Circuit breaker is active."
            exit 1
          fi

      - name: Install script dependencies
        if: steps.gate.outputs.should_review == 'true'
        run: uv sync --frozen
        working-directory: .claude/scripts

      - name: Post AI review
        if: steps.gate.outputs.should_review == 'true'
        run: |
          uv run --project .claude/scripts python .claude/scripts/review_code.py \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --context-dir docs/context
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_BEDROCK_ENDPOINT_URL: ${{ secrets.AWS_BEDROCK_ENDPOINT_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '❌ `ai-code-review` workflow failed. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });

name: Initialize Branches

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

permissions:
  contents: write
  issues: write

jobs:
  init-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create required branches if missing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for BRANCH in main dev; do
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
              echo "[info] Branch '$BRANCH' already exists — skipping"
            else
              git checkout -b "$BRANCH"
              git push origin "$BRANCH"
              echo "[info] Created branch '$BRANCH'"
              git checkout main
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure issue labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'ready-for-implementation-plan', color: '0E8A16', description: 'Issue is ready for AI implementation planning' },
              { name: 'implementation-plan-ready-for-review', color: '1D76DB', description: 'AI-generated implementation plan is ready for human review' },
              { name: 'ready-for-ai-coding', color: '5319E7', description: 'Issue is approved for AI code generation' },
              { name: 'ready-for-ai-review', color: 'FBCA04', description: 'PR is ready for AI code review' },
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
                core.info(`Created label: ${label.name}`);
              } catch (error) {
                if (error.status === 422) {
                  core.info(`Label already exists: ${label.name}`);
                  continue;
                }
                throw error;
              }
            }

name: Roadmap → Milestones

on:
  pull_request:
    types: [closed]
    branches: [roadmap]
    paths: ["docs/roadmap/ROADMAP-for-*.md"]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-milestones:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roadmap
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Detect roadmap file
        run: |
          ROADMAP_FILE=$(git diff --name-only HEAD~1 HEAD | grep "^docs/roadmap/ROADMAP-for-" | head -1)
          if [ -z "$ROADMAP_FILE" ]; then
            echo "::error::No ROADMAP-for-*.md found in merged changes."
            exit 1
          fi
          echo "ROADMAP_FILE=$ROADMAP_FILE" >> "$GITHUB_ENV"

      - name: Check circuit breaker
        run: |
          ACTIVE=$(python3 -c "import json; c=json.load(open('docs/context/AI_PIPELINE_CONFIG.json')); print(str(c['circuit_breaker_active']).lower())")
          if [ "$ACTIVE" = "true" ]; then
            echo "::error::Circuit breaker is active."
            exit 1
          fi

      - name: Install script dependencies
        run: uv sync --frozen
        working-directory: .claude/scripts

      - name: Generate milestones
        run: |
          uv run --project .claude/scripts python .claude/scripts/roadmap_to_milestones.py \
            --roadmap-file "$ROADMAP_FILE" \
            --repo "${{ github.repository }}" \
            --context-dir docs/context
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_BEDROCK_ENDPOINT_URL: ${{ secrets.AWS_BEDROCK_ENDPOINT_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '❌ `roadmap-to-milestones` workflow failed. Check the [Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });

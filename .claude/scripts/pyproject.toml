[project]
name = "ai-pipeline-scripts"
version = "0.1.0"
description = "AI pipeline scripts for enterprise-ai-sdlc-template"
requires-python = ">=3.12"
dependencies = [
    "anthropic[bedrock]>=0.40.0",
    "PyGithub>=2.5.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true

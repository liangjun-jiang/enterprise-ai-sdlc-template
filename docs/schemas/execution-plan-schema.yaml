# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: "https://json-schema.org/draft/2020-12/schema"
title: ExecutionPlan
description: Schema for AI-generated execution plans produced by generate_execution_plan.py
type: object

required:
  - feature_title
  - summary
  - tasks

properties:
  feature_title:
    type: string
    description: Title of the feature being implemented (matches PLAN.md heading)

  summary:
    type: string
    description: 2-3 sentence summary of the feature and implementation approach
    minLength: 20

  tasks:
    type: array
    description: Ordered list of implementation tasks
    minItems: 1
    maxItems: 20
    items:
      $ref: "#/$defs/Task"

$defs:
  Task:
    type: object
    required:
      - id
      - title
      - description
      - acceptance_criteria
      - affected_files
    properties:
      id:
        type: string
        pattern: "^TASK-[0-9]{3}$"
        description: Unique task identifier, e.g. TASK-001

      title:
        type: string
        description: Imperative-mood title, e.g. "Add /version endpoint to FastAPI app"
        minLength: 5
        maxLength: 100

      depends_on:
        type: array
        description: IDs of tasks that must be completed before this one
        items:
          type: string
          pattern: "^TASK-[0-9]{3}$"
        default: []

      description:
        type: string
        description: Concrete description of what code changes are needed
        minLength: 20

      acceptance_criteria:
        type: array
        description: Specific, testable criteria that define done
        minItems: 1
        items:
          type: string
          minLength: 10

      affected_files:
        type: array
        description: Files that will be created, modified, or deleted
        minItems: 1
        items:
          $ref: "#/$defs/AffectedFile"

  AffectedFile:
    type: object
    required:
      - path
      - action
    properties:
      path:
        type: string
        description: Repo-relative file path, e.g. backend/app/routers/version.py

      action:
        type: string
        enum: [create, modify, delete]
        description: What will happen to this file

      approximate:
        type: boolean
        description: True if the path is a best-guess and may change during implementation
        default: false
